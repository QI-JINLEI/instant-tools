<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即时工具 — JSON格式化 · Base64 · URL编解码</title>
<meta name="description" content="免费在线工具：JSON格式化验证、Base64编解码、URL编解码。即开即用，无需安装。">
<style>
  :root { --bg:#0f0f0f; --card:#1a1a1a; --text:#e0e0e0; --muted:#888; --accent:#00d4aa; --accent-hover:#00b894; --border:#2a2a2a; --input-bg:#252525; --danger:#ff6b6b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.6; }
  .header { text-align:center; padding:40px 20px 20px; }
  .header h1 { font-size:2rem; font-weight:700; letter-spacing:-0.5px; }
  .header h1 span { color:var(--accent); }
  .header p { color:var(--muted); margin-top:8px; font-size:0.95rem; }
  .container { max-width:900px; margin:0 auto; padding:0 20px 40px; }
  .tabs { display:flex; gap:4px; margin-bottom:24px; background:var(--card); border-radius:12px; padding:4px; }
  .tab { flex:1; padding:12px 16px; text-align:center; cursor:pointer; border-radius:10px; font-size:0.9rem; font-weight:500; color:var(--muted); transition:all 0.2s; border:none; background:none; }
  .tab:hover { color:var(--text); }
  .tab.active { background:var(--input-bg); color:var(--accent); }
  .tool-panel { display:none; }
  .tool-panel.active { display:block; }
  .card { background:var(--card); border-radius:12px; padding:24px; border:1px solid var(--border); }
  .row { display:flex; gap:12px; margin-bottom:16px; }
  .row.between { justify-content:space-between; align-items:center; }
  textarea { width:100%; min-height:200px; background:var(--input-bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:14px; font-family:'SF Mono','Fira Code','Consolas',monospace; font-size:0.9rem; resize:vertical; outline:none; transition:border 0.2s; }
  textarea:focus { border-color:var(--accent); }
  textarea.output { background:#0d1b17; }
  .btn { padding:10px 20px; border-radius:8px; font-size:0.9rem; font-weight:500; cursor:pointer; border:none; transition:all 0.2s; }
  .btn-primary { background:var(--accent); color:#000; }
  .btn-primary:hover { background:var(--accent-hover); }
  .btn-secondary { background:var(--input-bg); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover { background:#333; }
  .btn-danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .btn-danger:hover { background:rgba(255,107,107,0.1); }
  .btn-sm { padding:6px 14px; font-size:0.8rem; }
  .stats { display:flex; gap:20px; margin-top:12px; }
  .stat { font-size:0.8rem; color:var(--muted); }
  .stat strong { color:var(--accent); }
  .error { color:var(--danger); font-size:0.85rem; margin-top:8px; min-height:20px; }
  .label { font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  .copy-btn { position:relative; }
  .copied { position:absolute; top:-30px; left:50%; transform:translateX(-50%); background:var(--accent); color:#000; padding:4px 12px; border-radius:6px; font-size:0.75rem; white-space:nowrap; animation:fadeIn 0.2s; }
  @keyframes fadeIn { from{opacity:0;transform:translateX(-50%) translateY(4px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
  .footer { text-align:center; padding:20px; color:var(--muted); font-size:0.8rem; border-top:1px solid var(--border); }
  .footer a { color:var(--accent); text-decoration:none; }
  .col { flex:1; }
  @media (max-width:600px) { .row { flex-direction:column; } .tabs { flex-direction:column; gap:2px; } }
</style>
</head>
<body>

<div class="header">
  <h1>即时<span>工具</span></h1>
  <p>纯前端 · 离线可用 · 数据不上传</p>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('json')">📋 JSON 格式化</button>
    <button class="tab" onclick="switchTab('base64')">🔐 Base64 编解码</button>
    <button class="tab" onclick="switchTab('url')">🔗 URL 编解码</button>
  </div>

  <!-- JSON Tool -->
  <div id="json-panel" class="tool-panel active">
    <div class="card">
      <div class="row between">
        <span class="label">JSON 输入</span>
        <div>
          <button class="btn btn-sm btn-secondary" onclick="formatJson()">格式化</button>
          <button class="btn btn-sm btn-secondary" onclick="minifyJson()">压缩</button>
          <button class="btn btn-sm btn-secondary" onclick="validateJson()">验证</button>
          <button class="btn btn-sm btn-danger" onclick="clearAll('json')">清空</button>
        </div>
      </div>
      <textarea id="json-input" placeholder='{"name":"即时工具","version":"1.0","features":["JSON","Base64","URL"]}'></textarea>
      <div class="error" id="json-error"></div>
      <div class="row between" style="margin-top:12px;">
        <div class="stats" id="json-stats"></div>
        <button class="btn btn-primary copy-btn" onclick="copyText('json-input', this)">
          复制
          <span class="copied" style="display:none">已复制 ✓</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Base64 Tool -->
  <div id="base64-panel" class="tool-panel">
    <div class="card">
      <div class="row between">
        <span class="label">原文</span>
        <div>
          <button class="btn btn-primary" onclick="base64Encode()">编码 → Base64</button>
          <button class="btn btn-sm btn-danger" onclick="clearAll('base64')">清空</button>
        </div>
      </div>
      <textarea id="base64-input" placeholder="输入要编码的文字..."></textarea>
      <div class="error" id="base64-error"></div>
      <div class="row between" style="margin-top:12px;">
        <div class="stats" id="base64-stats"></div>
        <button class="btn btn-primary copy-btn" onclick="copyText('base64-input', this)">
          复制原文
          <span class="copied" style="display:none">已复制 ✓</span>
        </button>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="row between">
        <span class="label">Base64 编码结果</span>
        <div>
          <button class="btn btn-primary" onclick="base64Decode()">解码 → 原文</button>
          <button class="btn btn-sm btn-danger" onclick="clearAll('base64-out')">清空</button>
        </div>
      </div>
      <textarea id="base64-output" class="output" placeholder="或在这里输入 Base64 字符串进行解码..." readonly style="cursor:text;"></textarea>
      <div class="row between" style="margin-top:12px;">
        <div class="stats" id="base64-out-stats"></div>
        <button class="btn btn-primary copy-btn" onclick="copyText('base64-output', this)">
          复制结果
          <span class="copied" style="display:none">已复制 ✓</span>
        </button>
      </div>
    </div>
  </div>

  <!-- URL Tool -->
  <div id="url-panel" class="tool-panel">
    <div class="card">
      <div class="row between">
        <span class="label">待编解码 URL</span>
        <div>
          <button class="btn btn-primary" onclick="urlEncode()">编码</button>
          <button class="btn btn-primary" onclick="urlDecode()">解码</button>
          <button class="btn btn-sm btn-secondary" onclick="urlEncodeComponent()">编码组件</button>
          <button class="btn btn-sm btn-secondary" onclick="urlDecodeComponent()">解码组件</button>
          <button class="btn btn-sm btn-danger" onclick="clearAll('url')">清空</button>
        </div>
      </div>
      <textarea id="url-input" placeholder="输入 URL 或需要编解码的文字...如：https://example.com?q=你好世界"></textarea>
      <div class="error" id="url-error"></div>
      <div class="row between" style="margin-top:12px;">
        <div class="stats" id="url-stats"></div>
        <button class="btn btn-primary copy-btn" onclick="copyText('url-input', this)">
          复制
          <span class="copied" style="display:none">已复制 ✓</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <p>即时工具 · 纯前端，数据不上传 · <a href="https://github.com" target="_blank">开源</a></p>
</div>

<script>
// Tab switching
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${{json:1,base64:2,url:3}[name]})`).classList.add('active');
  document.getElementById(`${name}-panel`).classList.add('active');
}

// Copy
function copyText(id, btn) {
  const el = document.getElementById(id);
  el.select(); el.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(el.value).then(() => {
    const copied = btn.querySelector('.copied');
    copied.style.display = 'block';
    setTimeout(() => copied.style.display = 'none', 1500);
  });
}

// Clear
function clearAll(prefix) {
  const inputs = document.querySelectorAll(`[id^="${prefix}"]`);
  inputs.forEach(el => { if (el.tagName === 'TEXTAREA') el.value = ''; });
  const err = document.getElementById(`${prefix}-error`);
  if (err) err.textContent = '';
  updateStats();
}

// JSON
function formatJson() {
  const input = document.getElementById('json-input');
  const err = document.getElementById('json-error');
  try {
    const obj = JSON.parse(input.value);
    input.value = JSON.stringify(obj, null, 2);
    err.textContent = '';
    err.style.color = 'var(--accent)';
    err.textContent = '✓ 有效的 JSON';
    setTimeout(() => err.textContent = '', 2000);
  } catch(e) {
    err.style.color = 'var(--danger)';
    err.textContent = '❌ ' + e.message;
  }
  updateStats();
}

function minifyJson() {
  const input = document.getElementById('json-input');
  const err = document.getElementById('json-error');
  try {
    input.value = JSON.stringify(JSON.parse(input.value));
    err.textContent = '';
  } catch(e) {
    err.style.color = 'var(--danger)';
    err.textContent = '❌ ' + e.message;
  }
  updateStats();
}

function validateJson() {
  const input = document.getElementById('json-input');
  const err = document.getElementById('json-error');
  try {
    const obj = JSON.parse(input.value);
    err.style.color = 'var(--accent)';
    err.textContent = `✓ 有效 JSON · ${countNodes(obj)} 个节点`;
  } catch(e) {
    err.style.color = 'var(--danger)';
    err.textContent = '❌ 无效: ' + e.message;
  }
}

function countNodes(obj, depth=0) {
  if (depth > 50) return 0;
  if (obj === null || typeof obj !== 'object') return 1;
  let count = 1;
  for (const key in obj) count += countNodes(obj[key], depth+1);
  return count;
}

// Base64
function base64Encode() {
  const input = document.getElementById('base64-input');
  const output = document.getElementById('base64-output');
  const err = document.getElementById('base64-error');
  try {
    output.value = btoa(unescape(encodeURIComponent(input.value)));
    err.textContent = '';
  } catch(e) {
    err.textContent = '编码失败: ' + e.message;
  }
  updateStats();
}

function base64Decode() {
  const output = document.getElementById('base64-output');
  const input = document.getElementById('base64-input');
  const err = document.getElementById('base64-error');
  try {
    input.value = decodeURIComponent(escape(atob(output.value)));
    output.value = '';
    err.textContent = '';
  } catch(e) {
    err.textContent = '解码失败: 请检查 Base64 字符串是否有效';
  }
  updateStats();
}

// URL
function urlEncode() {
  const input = document.getElementById('url-input');
  input.value = encodeURI(input.value);
  updateStats();
}
function urlDecode() {
  const input = document.getElementById('url-input');
  try { input.value = decodeURI(input.value); } catch(e) { document.getElementById('url-error').textContent = '解码失败'; }
  updateStats();
}
function urlEncodeComponent() {
  const input = document.getElementById('url-input');
  input.value = encodeURIComponent(input.value);
  updateStats();
}
function urlDecodeComponent() {
  const input = document.getElementById('url-input');
  try { input.value = decodeURIComponent(input.value); } catch(e) { document.getElementById('url-error').textContent = '解码失败'; }
  updateStats();
}

// Stats
function updateStats() {
  // JSON stats
  const ji = document.getElementById('json-input');
  if (ji) {
    document.getElementById('json-stats').innerHTML = 
      `<span class="stat">字符: <strong>${ji.value.length.toLocaleString()}</strong></span>
       <span class="stat">行数: <strong>${(ji.value.match(/\n/g)||[]).length+1}</strong></span>`;
  }
  // Base64 stats
  const bi = document.getElementById('base64-input');
  if (bi) document.getElementById('base64-stats').innerHTML = `<span class="stat">字符: <strong>${bi.value.length.toLocaleString()}</strong></span>`;
  const bo = document.getElementById('base64-output');
  if (bo) document.getElementById('base64-out-stats').innerHTML = `<span class="stat">字符: <strong>${bo.value.length.toLocaleString()}</strong></span>`;
  // URL stats
  const ui = document.getElementById('url-input');
  if (ui) document.getElementById('url-stats').innerHTML = `<span class="stat">字符: <strong>${ui.value.length.toLocaleString()}</strong></span>`;
}

// Init
document.addEventListener('DOMContentLoaded', updateStats);
document.querySelectorAll('textarea').forEach(t => t.addEventListener('input', updateStats));

// Allow paste into "output" textareas
document.querySelectorAll('textarea.output').forEach(t => {
  t.addEventListener('click', function() { this.removeAttribute('readonly'); });
  t.addEventListener('blur', function() { this.setAttribute('readonly', 'true'); });
});
</script>
</body>
</html>
